name: AgriLink Core Service CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. LINT, TYPE-CHECK & TEST
  # ============================================================================
  lint-typecheck-test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python & ML Dependencies
        run: |
          python -m pip install --upgrade pip flake8
          pip install -r requirements.txt

      - name: Static Code Analysis & Linting (Flake8)
        run: |
          # Check for Python syntax errors and undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Python Bytecode Compilation Validation
        run: |
          python -m py_compile backend_fastapi/main.py
          echo "Bytecode compilation validated successfully."

      - name: 1. Modular NLP Engine Unit Tests
        run: |
          python nlp_engine/test_engine.py

      - name: 2. Farmer Vernacular Chatbot & Intent Classification
        run: |
          python test_farmer_nlp_chatbot.py

      - name: 3. Farmer Row-Level Security (RLS) Isolation
        run: |
          python verify_farmer_rls_nlp.py

      - name: 4. Dynamic Pricing Regressor & APMC Mandi Oracle
        run: |
          python test_mandi_pricing_integration.py

      - name: 5. Multi-Model Recommendation Engine Test
        run: |
          python backend_fastapi/test_recommendation_integration.py

      - name: 6. Full System Integrity Regression & API Contracts
        run: |
          python verify_full_system_integrity.py

  # ============================================================================
  # 2. DOCKER BUILD VALIDATION
  # ============================================================================
  docker-build:
    name: Docker Build Validation
    needs: [lint-typecheck-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with Buildx & Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: agrilink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: In-Container System Verification & Healthcheck
        run: |
          echo "Spinning up containerized AgriLink backend..."
          docker run -d -p 8000:8000 --name agrilink-test-server agrilink-backend:ci
          sleep 6
          docker ps
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health
          echo "Docker container live healthcheck passed successfully!"
          docker stop agrilink-test-server
          docker rm agrilink-test-server
