name: AgriLink Continuous Deployment (AWS EC2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "================================================="
            echo "🚀 Deploying latest AgriLink code to AWS EC2..."
            echo "================================================="
            cd ~/agrilink

            # 1. Pull latest code from GitHub
            git fetch origin main
            git reset --hard origin/main

            # 2. Update Python dependencies if requirements changed
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt

            # 3. Restart FastAPI & ML background service
            sudo systemctl restart agrilink

            # 4. Reload Nginx
            sudo nginx -t
            sudo systemctl reload nginx

            # 5. Verify local health check (retry until ML models finish loading)
            echo "Waiting for ML models and API server to initialize..."
            curl --retry 10 --retry-delay 2 --retry-connrefused -f http://127.0.0.1:8000/health
            echo ""
            echo "================================================="
            echo "✅ Successfully deployed! Latest app is live."
            echo "================================================="
