name: AgriLink Continuous Deployment (AWS EC2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Flutter Web & Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter SDK and build web release
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        working-directory: mobile_app
        run: |
          flutter --version
          flutter pub get
          flutter build web --release --no-tree-shake-icons
          echo "✅ Flutter web build complete"

      # 3. Upload built web files to EC2
      - name: Upload Flutter Web Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mobile_app/build/web/*"
          target: "~/agrilink-flutter-build"
          strip_components: 3
          rm: true
          overwrite: true

      # 4. Deploy backend + frontend on EC2 via SSH
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "================================================="
            echo "🚀 Deploying latest AgriLink code to AWS EC2..."
            echo "================================================="
            cd ~/agrilink

            # 1. Pull latest code from GitHub
            git fetch origin main
            git reset --hard origin/main

            # 2. Update Python dependencies if requirements changed
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt

            # 3. Deploy Flutter Web build to Nginx serving directory
            echo "📱 Deploying Flutter Web frontend..."
            echo "--- Nginx Sites Configuration ---"
            cat /etc/nginx/sites-enabled/* || true
            grep -rn "root" /etc/nginx/sites-enabled/ || true

            # Deploy directly to the actual Nginx root: /home/ubuntu/agrilink/frontend
            echo "Copying Flutter Web build to /home/ubuntu/agrilink/frontend..."
            sudo mkdir -p /home/ubuntu/agrilink/frontend
            sudo rm -rf /home/ubuntu/agrilink/frontend/*
            sudo cp -rf ~/agrilink-flutter-build/* /home/ubuntu/agrilink/frontend/
            sudo chown -R ubuntu:ubuntu /home/ubuntu/agrilink/frontend
            sudo chmod -R 755 /home/ubuntu/agrilink/frontend
            echo "✅ Flutter Web deployed to /home/ubuntu/agrilink/frontend"
            ls -la /home/ubuntu/agrilink/frontend/ | head -n 15

            # Also deploy to /var/www/html for complete coverage
            sudo mkdir -p /var/www/html
            sudo rm -rf /var/www/html/*
            sudo cp -rf ~/agrilink-flutter-build/* /var/www/html/
            sudo mkdir -p /var/www/html/agrilink
            sudo cp -rf ~/agrilink-flutter-build/* /var/www/html/agrilink/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            echo "✅ Flutter Web deployed to /var/www/html"

            # 4. Restart FastAPI & ML background service
            sudo systemctl restart agrilink

            # 5. Restart Nginx to flush all file caches
            sudo nginx -t
            sudo systemctl restart nginx

            # 6. Verify local health check (retry until ML models finish loading)
            echo "Waiting for ML models and API server to initialize..."
            curl --retry 10 --retry-delay 2 --retry-connrefused -f http://127.0.0.1:8000/health
            echo ""
            echo "================================================="
            echo "✅ Successfully deployed! Backend + Frontend live."
            echo "================================================="

      - name: Generate AWS EC2 Deployment Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 AWS EC2 Continuous Deployment Summary

          | Infrastructure Layer | Destination / Detail | Status |
          | :--- | :--- | :--- |
          | **Target Cloud Host** | AWS EC2 Ubuntu (`52.66.246.170`) | 🟢 Online |
          | **Web Server** | Nginx Reverse Proxy (Port 80) | 🟢 Active |
          | **Backend & ML Engine** | FastAPI ASGI Daemon (Port 8000) | 🟢 Healthy |
          | **Database** | AWS RDS PostgreSQL 16 (`agrilink_db1`) | 🟢 Connected (50 tables) |
          | **Deployed Commit** | `${{ github.sha }}` (`${{ github.ref_name }}`) | 🟢 Live |

          ### 🌐 Direct Access Endpoints
          * 📱 **Web & Flutter Application**: [http://52.66.246.170/](http://52.66.246.170/)
          * 📄 **Swagger Interactive API Documentation**: [http://52.66.246.170/docs](http://52.66.246.170/docs)
          * 📊 **Live Database Status**: [http://52.66.246.170/api/v1/database/status](http://52.66.246.170/api/v1/database/status)
          * 🩺 **Backend Health Probe**: [http://52.66.246.170/health](http://52.66.246.170/health)
          EOF
