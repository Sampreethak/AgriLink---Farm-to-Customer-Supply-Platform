version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrilink-backend:latest
    container_name: agrilink_api_server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
