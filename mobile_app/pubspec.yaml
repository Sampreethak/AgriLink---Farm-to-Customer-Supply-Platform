name: agrilink_app
description: "Farm-to-Customer Supply Platform"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ----------------------------
  # State Management
  # ----------------------------
  provider: ^6.1.2

  # ----------------------------
  # Navigation
  # ----------------------------
  go_router: ^14.2.0

  # ----------------------------
  # API Calls
  # ----------------------------
  dio: ^5.7.0

  # ----------------------------
  # Local Storage
  # ----------------------------
  shared_preferences: ^2.2.3

  # ----------------------------
  # Secure Storage (JWT Tokens)
  # ----------------------------
  flutter_secure_storage: ^10.0.0

  # ----------------------------
  # Image Picker
  # ----------------------------
  image_picker: ^1.1.2

  # ----------------------------
  # Fonts
  # ----------------------------
  google_fonts: ^6.2.1

  # ----------------------------
  # SVG Support
  # ----------------------------
  flutter_svg: ^2.0.10

  # ----------------------------
  # Date & Time
  # ----------------------------
  intl: ^0.19.0
  flutter_riverpod: ^2.4.0

  # ----------------------------
  # JSON Serialization
  # ----------------------------
  json_annotation: ^4.9.0

  # ----------------------------
  # New Additions
  # ----------------------------
  speech_to_text: ^7.4.0
  razorpay_flutter: ^1.3.7
  pin_code_fields: ^8.0.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.11

  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/animations/

  # Uncomment when you add custom fonts

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700